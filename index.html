<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>VIPER® Sensor Intelligence | DigitAlchemy®</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 100%; height: 100%; overflow: hidden; background: #0D1117; }
    canvas { display: block; }
    #ui { position: fixed; top: 24px; left: 50%; transform: translateX(-50%); text-align: center; pointer-events: none; }
    #ui h1 { color: #F8FAFC; font-family: sans-serif; font-size: 13px; letter-spacing: 0.2em; text-transform: uppercase; }
    #ui p { color: #2563EB; font-family: sans-serif; font-size: 10px; letter-spacing: 0.15em; margin-top: 4px; }
  </style>
  <script type="importmap">
  { "imports": { "playcanvas": "https://cdn.jsdelivr.net/npm/playcanvas/+esm" } }
  </script>
</head>
<body>
  <canvas id="app"></canvas>
  <div id="ui">
    <h1>VIPER® Sensor Intelligence</h1>
    <p>DigitAlchemy® · Step 5 · Ground Plane + Building Footprint</p>
  </div>
  <script type="module">
    import * as pc from 'playcanvas';

    const canvas = document.getElementById('app');
    const app = new pc.Application(canvas, {});
    app.setCanvasFillMode(pc.FILLMODE_FILL_WINDOW);
    app.setCanvasResolution(pc.RESOLUTION_AUTO);
    window.addEventListener('resize', () => app.resizeCanvas());

    // Camera — elevated angle looking down at site
    const camera = new pc.Entity('camera');
    camera.addComponent('camera', { clearColor: new pc.Color(0.05, 0.067, 0.09) });
    camera.setPosition(0, 12, 16);
    camera.lookAt(new pc.Vec3(0, 0, 0));
    app.root.addChild(camera);

    // Directional light
    const light = new pc.Entity('light');
    light.addComponent('light', { color: new pc.Color(0.8, 0.85, 1), intensity: 1.2 });
    light.setEulerAngles(45, 30, 0);
    app.root.addChild(light);

    // Ambient light
    app.scene.ambientLight = new pc.Color(0.08, 0.1, 0.15);

    // Ground plane
    const groundMat = new pc.StandardMaterial();
    groundMat.diffuse = new pc.Color(0.06, 0.09, 0.13);
    groundMat.emissive = new pc.Color(0.02, 0.04, 0.08);
    groundMat.update();

    const ground = new pc.Entity('ground');
    ground.addComponent('render', { type: 'plane', material: groundMat });
    ground.setLocalScale(24, 1, 24);
    app.root.addChild(ground);

    // Building footprint — main block
    const buildMat = new pc.StandardMaterial();
    buildMat.diffuse = new pc.Color(0.1, 0.15, 0.22);
    buildMat.emissive = new pc.Color(0.04, 0.06, 0.1);
    buildMat.update();

    function makeBlock(name, x, y, z, sx, sy, sz) {
      const e = new pc.Entity(name);
      e.addComponent('render', { type: 'box', material: buildMat });
      e.setPosition(x, y, z);
      e.setLocalScale(sx, sy, sz);
      app.root.addChild(e);
      return e;
    }

    // Main building mass
    makeBlock('building-main',  0,    0.75, 0,    8,  1.5, 5);
    // Wing A
    makeBlock('building-wingA', -4.5, 0.5,  2.5,  3,  1,   2);
    // Wing B
    makeBlock('building-wingB',  4.5, 0.5,  2.5,  3,  1,   2);
    // Core tower
    makeBlock('building-tower',  0,   1.75, -0.5, 2.5, 2,  2.5);

    // Grid lines on ground — blue edge lines
    const lineMat = new pc.StandardMaterial();
    lineMat.diffuse = new pc.Color(0.1, 0.25, 0.6);
    lineMat.emissive = new pc.Color(0.05, 0.15, 0.4);
    lineMat.update();

    for (let i = -10; i <= 10; i += 2) {
      const h = new pc.Entity();
      h.addComponent('render', { type: 'box', material: lineMat });
      h.setPosition(0, 0.01, i);
      h.setLocalScale(24, 0.01, 0.02);
      app.root.addChild(h);

      const v = new pc.Entity();
      v.addComponent('render', { type: 'box', material: lineMat });
      v.setPosition(i, 0.01, 0);
      v.setLocalScale(0.02, 0.01, 24);
      app.root.addChild(v);
    }

    // Slow camera orbit
    let angle = 0;
    app.on('update', dt => {
      angle += dt * 0.15;
      const r = 20;
      camera.setPosition(Math.sin(angle) * r, 12, Math.cos(angle) * r);
      camera.lookAt(new pc.Vec3(0, 1, 0));
    });

    app.start();
  </script>
</body>
</html>
